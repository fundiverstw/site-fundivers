<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The calendar and travel pages call the booking app's database, but not
         until the JavaScript has downloaded and parsed. Opening the connection
         now means the DNS lookup and TLS handshake happen alongside that
         download instead of after it. Vite substitutes the value at build time. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- The backdrop behind every page. It is a background-image in
         styles/background.css, which means the browser cannot know it exists
         until it has downloaded and parsed the stylesheet — and it is the
         largest thing painted on first load, so that wait is the page's LCP.
         Naming it here starts the fetch while the CSS is still in flight.

         This is why the file stays in public/ under a fixed name: a bundled
         asset gets a content hash in its filename, and there would be no way to
         write that name into this file. Keep the path in step with the url()
         in background.css. -->
    <link rel="preload" as="image" href="/imgs/diver-bg.jpg" fetchpriority="high" />
    <meta
      name="description"
      content="FunDivers TW — guided scuba diving trips, PADI courses, and dive site adventures across Taiwan and beyond."
    />
    <meta property="og:title" content="FunDivers TW — Scuba Diving in Taiwan" />
    <meta
      property="og:description"
      content="Guided dive trips, PADI courses, gear, and dive sites across Taiwan."
    />
    <meta property="og:type" content="website" />
    <title>FunDivers TW — Scuba Diving in Taiwan</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
